# Commits run the fast fixers; the whole gate, `just qa`, runs before a push. A plain
# `uvx pre-commit install` installs both hook types (default_install_hook_types).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # MUST equal the `ruff==` pin in pyproject: hook and gate sort imports and format alike only
    # at the same version. A bump changes uv.lock and this rev together.
    rev: v0.17.2
    hooks:
      # FIXERS, not the gate: `just qa` is the authority on whether lint and format pass.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # uv.lock must stay consistent with pyproject.toml.
      - id: uv-lock-check
        name: uv-lock consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      # THE GATE ITSELF -- `just qa`, not a list of what qa contains, so hook and gate cannot
      # disagree. On pre-push because the tests are most of the cost. Through `just`: a bare
      # `uv run pytest` fails to spawn under `uvx pre-commit`.
      - id: qa
        name: just qa
        entry: just qa
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
