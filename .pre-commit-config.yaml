repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  # anti-sprawl: flag dead/unused code before it accumulates
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [src/, --min-confidence, "80"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The contract that keeps the dependency direction one-way: no consumer
      # (mcp, fastmcp, omnirag, lancedb) may be imported from calibre_core.
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      # supply-chain: uv.lock must stay consistent with pyproject.toml
      - id: uv-lock-check
        name: uv-lock consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
